[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-forecast"
version = "0.1.0"
description = "Financial forecasting models using TensorFlow with Bayesian inference"
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.14",
    "tensorflow-probability>=0.22",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "pdfplumber>=0.10",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["financial_forecast*", "loan_pricing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["loan_pricing"]

[tool.ruff]
target-version = "py39"
src = ["loan_pricing"]

[tool.black]
target-version = ["py39"]
